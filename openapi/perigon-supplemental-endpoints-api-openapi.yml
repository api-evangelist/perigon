openapi: 3.2.0
info:
  title: Perigon Supplemental Endpoints API
  description: The Perigon API provides access to comprehensive news and web content data. To use the API, simply sign up for a Perigon Business Solutions account to obtain your API key. Your available features may vary based on your plan. See the Authentication section for details on how to use your API key.
  contact:
    name: Perigon Support
    url: https://docs.perigon.io/
    email: data@perigon.io
  version: 1.0.0
servers:
- url: https://api.perigon.io
  description: Generated server url
security:
- apiKeyAuth: []
tags:
- name: Supplemental Endpoints
  description: Additional endpoints for metadata and related information
paths:
  /v1/companies/all:
    get:
      tags:
      - Supplemental Endpoints
      summary: Companies
      description: Browse or search for companies Perigon tracks using name, domain, ticker symbol, industry, and more. Supports Boolean search logic and filtering by metadata such as country, exchange, employee count, and IPO date.
      operationId: search-companies
      parameters:
      - name: id
        in: query
        description: String Array. Filter by unique company identifiers. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: symbol
        in: query
        description: String Array. Filter by company stock ticker symbols (e.g., AAPL, MSFT, GOOGL). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: symbolIsin
        in: query
        description: String Array. Filter by ISIN codes on company ticker listings. Matches symbols.isin rather than the company-level ISIN. Multiple values create an OR filter.
        required: false
        schema:
          maxItems: 300
          minItems: 0
          type: array
          items:
            type: string
      - name: domain
        in: query
        description: String Array. Filter by company domains or websites (e.g., apple.com, microsoft.com). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: country
        in: query
        description: String Array. Filter by company headquarters country. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: exchange
        in: query
        description: String Array. Filter by stock exchange where companies are listed (e.g., NASDAQ, NYSE). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: numEmployeesFrom
        in: query
        description: Integer. Filter for companies with at least this many employees.
        required: false
        schema:
          type: integer
          format: int32
      - name: numEmployeesTo
        in: query
        description: Integer. Filter for companies with no more than this many employees.
        required: false
        schema:
          type: integer
          format: int32
      - name: ipoFrom
        in: query
        description: Date. Filter for companies that went public on or after this date. Accepts ISO 8601 format (e.g., 2023-01-01T00:00:00) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: ipoTo
        in: query
        description: Date. Filter for companies that went public on or before this date. Accepts ISO 8601 format (e.g., 2023-12-31T23:59:59) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: q
        in: query
        description: String. Primary search query for filtering companies across name, alternative names, domains, and ticker symbols. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: String. Search within company names. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: industry
        in: query
        description: String. Filter by company industry classifications. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: sector
        in: query
        description: String. Filter by company sector classifications. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: size
        in: query
        description: Integer. The number of companies to return per page in the paginated response.
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: page
        in: query
        description: Integer. The specific page of results to retrieve in the paginated response. Starts at 0.
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
      responses:
        '401':
          description: 401 - Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Invalid API key.
                timestamp: 1681338367402
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CompanySearchResult'
        '500':
          description: 500 - Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal error. Please contact the support to resolve the problem. We apologize for any inconvenience :)
                timestamp: 1681338367402
        '400':
          description: 400 - Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Errors during parameter validation.
                timestamp: 1681338367402
        '403':
          description: 403 - Request Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                message: The number of allowed requests is exceeded.
                timestamp: 1681338367402
        '429':
          description: 429 - Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 429
                message: Exceeded request rate limit for your account.
                timestamp: 1681338367402
      security:
      - apiKeyAuth: []
  /v1/journalists/all:
    get:
      tags:
      - Supplemental Endpoints
      summary: Journalists
      description: Search journalists using broad search attributes. Our database contains over 230,000 journalists from around the world and is refreshed frequently.
      operationId: search-journalists
      parameters:
      - name: id
        in: query
        description: String Array. Filter by unique journalist identifiers. Multiple values create an OR filter to find journalists matching any of the specified IDs.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: q
        in: query
        description: String. Primary search query for filtering journalists based on their name, title, and Twitter bio. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: String. Search specifically within journalist names. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: twitter
        in: query
        description: String. Filter journalists by their exact Twitter handle, without the @ symbol.
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: String. Sort journalists from highest to lowest by avgMonthlyPosts, linkedinConnections, or linkedinFollowers. When omitted, results are sorted by relevance.
        required: false
        schema:
          $ref: '#/components/schemas/JournalistsSortBy'
      - name: size
        in: query
        description: Integer. The number of journalists to return per page in the paginated response.
        required: false
        schema:
          maximum: 1000
          minimum: 0
          type: integer
          format: int32
      - name: page
        in: query
        description: Integer. The specific page of results to retrieve in the paginated response. Starts at 0.
        required: false
        schema:
          minimum: 0
          type: integer
          format: int32
      - name: source
        in: query
        description: String Array. Filter journalists by the publisher domains they write for. Supports wildcards (* and ?) for pattern matching (e.g., *.cnn.com). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: topic
        in: query
        description: 'String Array. Filter journalists by the top topics they cover. Topics are more specific themes that the article is about. Examples of topics: ''Economy'', ''Real Estate'', ''Cryptocurrency''. If multiple parameters are passed, they will be applied as OR operations. (Searches inside the topCategories data field.)'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: category
        in: query
        description: 'String Array. Filter journalists by the top categories they cover. Categories are general themes that the article is about. Examples of categories: Tech, Politics, etc. If multiple parameters are passed, they will be applied as OR operations. (Searches inside the topCategories data field.)'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: label
        in: query
        description: String Array. Filter journalists by the most common label tagged to the articles they publish. This accepts labels like 'Opinion' or 'Pop Culture'. (Searches the topLabels data field.)
        required: false
        schema:
          type: array
          items:
            type: string
      - name: minMonthlyPosts
        in: query
        description: Integer. Filter for journalists who publish at least this many articles per month. Used to identify more active journalists.
        required: false
        schema:
          type: integer
          format: int32
      - name: maxMonthlyPosts
        in: query
        description: Integer. Filter for journalists who publish no more than this many articles per month.
        required: false
        schema:
          type: integer
          format: int32
      - name: country
        in: query
        description: String Array. Filter journalists by countries they commonly cover in their reporting. Uses ISO 3166-1 alpha-2 two-letter country codes in lowercase (e.g., us, gb, jp). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: locationCountry
        in: query
        description: String Array. Filter journalists by their profile location country (`locations.country`). Uses ISO 3166-1 alpha-2 two-letter country codes in lowercase (e.g., us, gb, jp). `uk` is accepted as an alias for `gb`. Distinct from `country`, which filters reporting focus (`topCountries`). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: locationState
        in: query
        description: String Array. Filter journalists by their profile location state or region (`locations.state`). For US locations this is the two-letter state code (e.g., NY, CA). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: locationCounty
        in: query
        description: String Array. Filter journalists by their profile location county (`locations.county`). County names should match stored metadata (e.g., 'Los Angeles County', 'Cook County'). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: locationCity
        in: query
        description: String Array. Filter journalists by their profile location city (`locations.city`). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: locationArea
        in: query
        description: String Array. Filter journalists by their profile location area — neighborhood, borough, or district (`locations.area`). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: updatedAtFrom
        in: query
        description: Date. Filter for journalist profiles updated on or after this date. Accepts ISO 8601 format (e.g., 2023-03-01T00:00:00) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: updatedAtTo
        in: query
        description: Date. Filter for journalist profiles updated on or before this date. Accepts ISO 8601 format (e.g., 2023-03-01T23:59:59) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: showNumResults
        in: query
        description: Boolean. Controls whether to return the exact result count. When false (default), counts are capped at 10,000 for performance reasons. Set to true for precise counts in smaller result sets.
        required: false
        schema:
          type: boolean
      responses:
        '401':
          description: 401 - Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Invalid API key.
                timestamp: 1681338367402
        '500':
          description: 500 - Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal error. Please contact the support to resolve the problem. We apologize for any inconvenience :)
                timestamp: 1681338367402
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalistSearchResult'
        '400':
          description: 400 - Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Errors during parameter validation.
                timestamp: 1681338367402
        '403':
          description: 403 - Request Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                message: The number of allowed requests is exceeded.
                timestamp: 1681338367402
        '429':
          description: 429 - Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 429
                message: Exceeded request rate limit for your account.
                timestamp: 1681338367402
      security:
      - apiKeyAuth: []
