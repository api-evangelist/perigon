  /v1/sources/all:
    get:
      tags:
      - Supplemental Endpoints
      summary: Sources
      description: Search and filter the 200,000+ media sources available via the Perigon API. The result includes a list of individual media sources that were matched to your specific criteria.
      operationId: search-sources
      parameters:
      - name: domain
        in: query
        description: String Array. Filter by specific publisher domains or subdomains. Supports wildcards (* and ?) for pattern matching (e.g., *.cnn.com, us?.nytimes.com). Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: name
        in: query
        description: String. Search by source name or alternative names. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: sourceGroup
        in: query
        description: String. Filter by predefined publisher bundles (e.g., top100, top50tech). Returns all sources within the specified group. See documentation for available source groups.
        required: false
        schema:
          type: string
      - name: sortBy
        in: query
        description: String. Determines the source sorting order. Options include relevance (default, best match to query), globalRank (by overall traffic and popularity), monthlyVisits (by total monthly visitor count), and avgMonthlyPosts (by number of articles published monthly).
        required: false
        schema:
          $ref: '#/components/schemas/SourcesSortBy'
      - name: page
        in: query
        description: Integer. The specific page of results to retrieve in the paginated response. Starts at 0.
        required: false
        schema:
          maximum: 10000
          minimum: 0
          type: integer
          format: int32
      - name: size
        in: query
        description: Integer. The number of sources to return per page in the paginated response.
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          format: int32
      - name: minMonthlyVisits
        in: query
        description: Integer. Filter for sources with at least this many monthly visitors. Used to target publishers by audience size.
        required: false
        schema:
          type: integer
          format: int64
      - name: maxMonthlyVisits
        in: query
        description: Integer. Filter for sources with no more than this many monthly visitors. Used to target publishers by audience size.
        required: false
        schema:
          type: integer
          format: int64
      - name: minMonthlyPosts
        in: query
        description: Integer. Filter for sources that publish at least this many articles per month. Used to target publishers by content volume.
        required: false
        schema:
          type: integer
          format: int64
      - name: maxMonthlyPosts
        in: query
        description: Integer. Filter for sources that publish no more than this many articles per month. Used to target publishers by content volume.
        required: false
        schema:
          type: integer
          format: int64
      - name: country
        in: query
        description: String Array. Filter sources by countries they commonly cover in their reporting. Uses ISO 3166-1 alpha-2 two-letter country codes in lowercase (e.g., us, gb, jp). See documentation for supported country codes. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sourceCountry
        in: query
        description: String Array. Filter for local publications based in specific countries. Uses ISO 3166-1 alpha-2 two-letter country codes in lowercase (e.g., us, gb, jp). See documentation for supported country codes. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sourceState
        in: query
        description: String Array. Filter for local publications based in specific states or regions. Uses standard two-letter state codes in lowercase (e.g., ca, ny, tx). See documentation for supported state codes. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sourceCounty
        in: query
        description: String Array. Filter for local publications based in specific counties. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sourceCity
        in: query
        description: String Array. Filter for local publications based in specific cities. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sourceLat
        in: query
        description: Float. Latitude coordinate for filtering local publications by geographic proximity. Used with sourceLon and sourceMaxDistance for radius search.
        required: false
        schema:
          maximum: 90
          minimum: -90
          type: number
          format: double
      - name: sourceLon
        in: query
        description: Float. Longitude coordinate for filtering local publications by geographic proximity. Used with sourceLat and sourceMaxDistance for radius search.
        required: false
        schema:
          maximum: 180
          minimum: -180
          type: number
          format: double
      - name: sourceMaxDistance
        in: query
        description: Float. Maximum distance in kilometers from the coordinates defined by sourceLat and sourceLon. Defines the radius for local publication searches.
        required: false
        schema:
          maximum: 300
          minimum: 1
          type: number
          format: double
      - name: category
        in: query
        description: String Array. Filter sources by their primary content categories such as Politics, Tech, Sports, Business, or Finance. Returns sources that frequently cover these topics. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: topic
        in: query
        description: String Array. Filter sources by their frequently covered topics (e.g., Markets, Cryptocurrency, Climate Change). Returns sources where the specified topic is among their top 10 covered areas. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: label
        in: query
        description: String Array. Filter sources by their content label patterns (e.g., Opinion, Paid-news, Non-news). Returns sources where the specified label is common in their published content. See documentation for all available labels. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: paywall
        in: query
        description: Boolean. Filter by paywall status. Set to true to find sources with paywalls, or false to find sources without paywalls.
        required: false
        schema:
          type: boolean
      - name: showSubdomains
        in: query
        description: Boolean. Controls whether subdomains are included as separate results. When true (default), subdomains appear as distinct sources. When false, results are consolidated to parent domains only.
        required: false
        schema:
          type: boolean
      - name: showNumResults
        in: query
        description: Boolean. Controls whether to return the exact result count. When false (default), counts are capped at 10,000 for performance reasons. Set to true for precise counts in smaller result sets.
        required: false
        schema:
          type: boolean
