components:
  schemas:
    SourceGroupResolveResult:
      required:
      - data
      type: object
      properties:
        data:
          type: array
          description: Resolved source groups.
          items:
            $ref: '#/components/schemas/SourceGroupDto'
      description: Resolved source groups response.
      example:
        data:
        - id: 17
          createdAt: '2025-05-10T08:00:00.000Z'
          updatedAt: '2025-07-20T12:45:00.000Z'
          name: tier-1-tech
          displayName: Tier 1 Tech
          description: Major technology news outlets.
          domains:
          - reuters.com
          - apnews.com
          - bbc.com
          - cnn.com
          organizationId: 1001
          visible: true
    SourceGroupListResult:
      required:
      - data
      - total
      type: object
      properties:
        total:
          type: integer
          description: Total number of matching source groups across all pages.
          format: int64
        data:
          type: array
          description: Source groups returned for the requested page.
          items:
            $ref: '#/components/schemas/SourceGroupDto'
      description: Paginated list of source groups.
      example:
        total: 1
        data:
        - id: 17
          createdAt: '2025-05-10T08:00:00.000Z'
          updatedAt: '2025-07-20T12:45:00.000Z'
          name: tier-1-tech
          displayName: Tier 1 Tech
          description: Major technology news outlets.
          domains:
          - reuters.com
          - apnews.com
          - bbc.com
          - cnn.com
          organizationId: 1001
          visible: true
    SourceGroupSortBy:
      type: string
      enum:
      - id
      - createdAt
      - updatedAt
      - name
    CreateSourceGroupParams:
      required:
      - domains
      - name
      type: object
      properties:
        name:
          type: string
        displayName:
          type:
          - string
          - 'null'
        description:
          type:
          - string
          - 'null'
        domains:
          maxItems: 5000
          minItems: 1
          type: array
          items:
            type: string
    ErrorResponse:
      type: object
      properties:
        status:
          type:
          - integer
          - 'null'
          format: int32
        message:
          type:
          - string
          - 'null'
        timestamp:
          type:
          - integer
          - 'null'
          format: int64
    PatchSourceGroupParams:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Unique name for the source group within the organization
        displayName:
          type:
          - string
          - 'null'
          description: Display name for the source group
        description:
          maxLength: 512
          minLength: 0
          type:
          - string
          - 'null'
          description: Description of the source group
        domains:
          maxItems: 5000
          minItems: 1
          type:
          - array
          - 'null'
          description: List of domains included in the source group
          items:
            type: string
            description: List of domains included in the source group
    SourceGroupResult:
      required:
      - data
      type: object
      properties:
        data:
          $ref: '#/components/schemas/SourceGroupDto'
      description: Single source group response.
      example:
        data:
          id: 17
          createdAt: '2025-05-10T08:00:00.000Z'
          updatedAt: '2025-07-20T12:45:00.000Z'
          name: tier-1-tech
          displayName: Tier 1 Tech
          description: Major technology news outlets.
          domains:
          - reuters.com
          - apnews.com
          - bbc.com
          - cnn.com
          organizationId: 1001
          visible: true
    SourceGroupDto:
      type: object
      properties:
        id:
          type:
          - integer
          - 'null'
          description: Numeric identifier for the source group.
          format: int32
        createdAt:
          type:
          - string
          - 'null'
          description: Date and time the source group was created, in ISO 8601 format.
          format: date-time
        updatedAt:
          type:
          - string
          - 'null'
          description: Date and time the source group was last updated, in ISO 8601 format.
          format: date-time
        name:
          type:
          - string
          - 'null'
          description: Unique slug name for the source group.
        displayName:
          type:
          - string
          - 'null'
          description: Human-readable display name.
        description:
          type:
          - string
          - 'null'
          description: Optional description of the source group.
        domains:
          type:
          - array
          - 'null'
          description: Publisher domains included in the group.
          items:
            type: string
            description: Publisher domains included in the group.
        organizationId:
          type:
          - integer
          - 'null'
          description: Owning organization ID when the source group is private.
          format: int32
        visible:
          type:
          - boolean
          - 'null'
          description: Whether the source group is publicly visible.
      description: Named group of news source domains for filtering search and monitors.
  securitySchemes:
    apiKeyAuth:
      type: http
      scheme: bearer
