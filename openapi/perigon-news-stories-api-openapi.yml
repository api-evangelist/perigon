components:
  schemas:
    NameCount:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the aggregated value.
        count:
          type:
          - integer
          - 'null'
          description: Number of matching records for the value.
          format: int64
      description: Countries most frequently associated with the journalist's articles.
    ErrorResponse:
      type: object
      properties:
        status:
          type:
          - integer
          - 'null'
          format: int32
        message:
          type:
          - string
          - 'null'
        timestamp:
          type:
          - integer
          - 'null'
          format: int64
    KeywordHolder:
      type: object
      properties:
        name:
          type:
          - string
          - 'null'
          description: Keyword extracted from the article.
        weight:
          type:
          - number
          - 'null'
          description: Relative relevance weight of the keyword.
          format: float
      description: Keywords extracted from the article with their relevance weights.
    StoryHistoryRecord:
      type: object
      properties:
        clusterId:
          type:
          - string
          - 'null'
          description: Unique identifier of the story associated with this history record.
        createdAt:
          type:
          - string
          - 'null'
          description: Date and time the history record was created, in ISO 8601 format.
        name:
          type:
          - string
          - 'null'
          description: Story name captured in this history record, when available.
        triggeredAt:
          type:
          - string
          - 'null'
          description: Date and time the story refresh that produced this record was triggered, in ISO 8601 format.
        summary:
          type:
          - string
          - 'null'
          description: Story summary captured in this history record.
        shortSummary:
          type:
          - string
          - 'null'
          description: Short story summary captured in this history record, when available.
        changelog:
          type:
          - string
          - 'null'
          description: Description of changes from the previous story version, when available.
        keyPoints:
          type:
          - array
          - 'null'
          description: Key points captured for this version of the story.
          items:
            $ref: '#/components/schemas/KeyPoint'
        questions:
          type:
          - array
          - 'null'
          description: Questions and answers generated for this version of the story.
          items:
            $ref: '#/components/schemas/Question'
      description: History records returned for the requested page.
    ArticleRefreshJobResponse:
      type: object
