  /v1/stories/all:
    get:
      tags:
      - News & Stories
      summary: Stories
      description: 'Track evolving narratives and top news headlines with the ''**Stories**'' endpoint — it returns structured clusters of related articles with summaries, key points, sentiment scores, and metadata on top people, companies, topics, countries, and categories. Use it to monitor how news stories develop over time, who and what they impact, and where they''re gaining traction globally.


        Each story represents a cluster of related articles grouped during processing. Articles are assigned to a single story, identified by the `clusterId` field. Once a story reaches five articles, a story title is automatically generated based on its content. Stories update as new coverage is processed and key details evolve.


        To fetch all articles within a specific story, query the `/articles/all` endpoint using the `clusterId` parameter.'
      operationId: search-stories
      parameters:
      - name: q
        in: query
        description: String. Primary search query for filtering stories based on their name, summary, and key points. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: name
        in: query
        description: String. Search specifically within story names. Supports Boolean operators, exact phrases with quotes, and wildcards for matching name variations.
        required: false
        schema:
          type: string
      - name: clusterId
        in: query
        description: String Array. Filter to specific stories using their unique identifiers. Each clusterId represents a distinct story that groups related articles. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: excludeClusterId
        in: query
        description: String Array. Excludes specific stories from the results by their unique identifiers. Use this parameter to filter out unwanted or previously seen stories.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sortBy
        in: query
        description: String. Determines the story sorting order. Options include createdAt (default, when stories first emerged), updatedAt (when stories received new articles, best for tracking developing events), relevance (best match to query), count (by unique article count), and totalCount (by total article count including reprints).
        required: false
        schema:
          $ref: '#/components/schemas/ClustersListSortBy'
      - name: page
        in: query
        description: Integer. The specific page of results to retrieve in the paginated response. Starts at 0.
        required: false
        schema:
          maximum: 10000
          minimum: 0
          type: integer
          format: int32
      - name: size
        in: query
        description: Integer. The number of articles to return per page in the paginated response.
        required: false
        schema:
          maximum: 100
          minimum: 0
          type: integer
          format: int32
      - name: from
        in: query
        description: Filter for stories created on or after this date. Accepts ISO 8601 or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Filter for stories created on or before this date. Accepts ISO 8601 or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: initializedFrom
        in: query
        description: Filter for stories initialized on or after this date. A story is initialized when it becomes visible with generated story data.
        required: false
        schema:
          type: string
          format: date-time
      - name: initializedTo
        in: query
        description: Filter for stories initialized on or before this date. A story is initialized when it becomes visible with generated story data.
        required: false
        schema:
          type: string
          format: date-time
      - name: updatedFrom
        in: query
        description: Date. Filter for stories that received new articles after this date. Useful for tracking developing news events or evolving storylines.
        required: false
        schema:
          type: string
          format: date-time
      - name: updatedTo
        in: query
        description: Date. Filter for stories that received new articles before this date. Useful for tracking developing news events or evolving storylines.
        required: false
        schema:
          type: string
          format: date-time
      - name: topic
        in: query
        description: String Array. Filter stories by specific topics such as Markets, Crime, Cryptocurrency, or College Sports. Topics are more granular than categories, and stories can include multiple topics based on their constituent articles. Use the /topics endpoint for a complete list of available topics. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: category
        in: query
        description: String Array. Filter stories by broad content categories such as Politics, Tech, Sports, Business, or Finance. Use 'none' to find uncategorized stories. Categories are derived from the articles within each story. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: taxonomy
        in: query
        description: 'String Array. Filter stories by Google Content Categories. Must pass the full hierarchical path of the category. Example: taxonomy=/Finance/Banking/Other,/Finance/Investing/Funds. Stories are categorized based on their constituent articles. Multiple values create an OR filter.'
        required: false
        schema:
          type: array
          items:
            type: string
      - name: source
        in: query
        description: String Array. Filter stories that contain articles from specific publisher domains or subdomains. Supports wildcards (* and ?) for pattern matching (e.g., *.cnn.com). A story will match if it contains at least one article from any of the specified sources. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sourceGroup
        in: query
        description: String Array. Filter stories that contain articles from publishers in Perigon's curated bundles (e.g., top100, top25crypto). A story will match if it contains at least one article from any publisher in the specified bundles. Multiple values create an OR filter.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: minUniqueSources
        in: query
        description: Integer. Specifies the minimum number of unique sources required for a story to appear in results. Higher values return more significant stories covered by multiple publications. Default is 3.
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: minSourceDiversity
        in: query
        description: Float. Minimum ratio of unique sources to unique articles (uniqueSources / uniqueCount). Filters out stories dominated by a single publisher. For example, a value of 0.05 requires at least 1 unique source per 20 articles. Not applied by default.
        required: false
        schema:
          maximum: 1
          minimum: 0
          type: number
      - name: personWikidataId
        in: query
        description: String Array. Filter stories by Wikidata IDs of top mentioned people. Returns stories where these individuals appear prominently. Refer to the /people endpoint for a complete list of tracked individuals.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: personName
        in: query
        description: String. Filter stories by exact name matches of top mentioned people. Does not support Boolean or complex logic. For available person entities, consult the /people endpoint.
        required: false
        schema:
          type: string
      - name: companyId
        in: query
        description: String Array. Filter stories by identifiers of top mentioned companies. Returns stories where these companies appear prominently. For a complete list of tracked companies, refer to the /companies endpoint.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: companyName
        in: query
        description: String. Filter stories by names of top mentioned companies. Performs an exact match on company names in the topCompanies field.
        required: false
        schema:
          type: string
      - name: companyDomain
        in: query
        description: String Array. Filter stories by domains of top mentioned companies (e.g., apple.com). Returns stories where companies with these domains appear prominently. For available company entities, consult the /companies endpoint.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: companySymbol
        in: query
        description: String Array. Filter stories by stock symbols of top mentioned companies. Returns stories where companies with these symbols appear prominently. For available company entities and their symbols, consult the /companies endpoint.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: companyIsin
        in: query
        description: String Array. Filter stories by ISIN codes of top mentioned companies (International Securities Identification Numbers). Returns stories where companies with these ISINs appear prominently. For available company entities and their ISINs, consult the /companies endpoint.
        required: false
        schema:
          maxItems: 300
          minItems: 0
          type: array
          items:
            type: string
      - name: companySymbolIsin
        in: query
        description: String Array. Filter stories by ISIN codes on ticker listings of top mentioned companies (symbols.isin). Distinct from companyIsin, which matches the company-level ISIN. Returns stories where those companies appear prominently. For available company entities and their listing ISINs, consult the /companies endpoint.
        required: false
        schema:
          maxItems: 300
          minItems: 0
          type: array
          items:
            type: string
      - name: country
        in: query
        description: String Array. Country code to filter by country. If multiple parameters are passed, they will be applied as OR operations.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: state
        in: query
        description: String Array. Filter local news by state. Applies only to local news, when this param is passed non-local news will not be returned. If multiple parameters are passed, they will be applied as OR operations.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: city
        in: query
        description: String Array. Filter local news by city. Applies only to local news, when this param is passed non-local news will not be returned. If multiple parameters are passed, they will be applied as OR operations.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: area
        in: query
        description: String Array. Filter local news by area. Applies only to local news, when this param is passed non-local news will not be returned. If multiple parameters are passed, they will be applied as OR operations.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: minClusterSize
        in: query
        description: Integer. Filter by minimum cluster size. Minimum cluster size filter applies to number of unique articles.
        required: false
        schema:
          minimum: 1
          type: integer
          format: int32
      - name: maxClusterSize
        in: query
        description: Integer. Filter by maximum cluster size. Maximum cluster size filter applies to number of unique articles in the cluster.
        required: false
        schema:
          type: integer
          format: int32
      - name: nameExists
        in: query
        description: Boolean. Filter to only include stories that have been assigned names. Defaults to true. Note that stories only receive names after they contain at least 5 unique articles.
        required: false
        schema:
          type: boolean
      - name: positiveSentimentFrom
        in: query
        description: Filter stories with an aggregate positive sentiment score greater than or equal to the specified value. Scores range from 0 to 1, with higher values indicating stronger positive tone.
        required: false
        schema:
          type: number
          format: float
      - name: positiveSentimentTo
        in: query
        description: Filter stories with an aggregate positive sentiment score less than or equal to the specified value. Scores range from 0 to 1, with higher values indicating stronger positive tone.
        required: false
        schema:
          type: number
          format: float
      - name: neutralSentimentFrom
        in: query
        description: Filter stories with an aggregate neutral sentiment score greater than or equal to the specified value. Scores range from 0 to 1, with higher values indicating stronger neutral tone.
        required: false
        schema:
          type: number
          format: float
      - name: neutralSentimentTo
        in: query
        description: Filter stories with an aggregate neutral sentiment score less than or equal to the specified value. Scores range from 0 to 1, with higher values indicating stronger neutral tone.
        required: false
        schema:
          type: number
          format: float
      - name: negativeSentimentFrom
        in: query
        description: Filter stories with an aggregate negative sentiment score greater than or equal to the specified value. Scores range from 0 to 1, with higher values indicating stronger negative tone.
        required: false
        schema:
          type: number
          format: float
      - name: negativeSentimentTo
        in: query
        description: Filter stories with an aggregate negative sentiment score less than or equal to the specified value. Scores range from 0 to 1, with higher values indicating stronger negative tone.
        required: false
        schema:
          type: number
          format: float
      - name: showStoryPageInfo
        in: query
        description: Boolean.
        required: false
        schema:
          type: boolean
      - name: showNumResults
        in: query
        description: Boolean. Show total number of results. By default set to false, will cap result count at 10000.
        required: false
        schema:
          type: boolean
      - name: showDuplicates
        in: query
        description: Boolean. Stories are deduplicated by default. If a story is deduplicated, all future articles are merged into the original story. duplicateOf field contains the original cluster Id. When showDuplicates=true, all stories are shown.
        required: false
        schema:
          type: boolean
      - name: showHighlighting
        in: query
        description: Boolean. When set to true, enables text highlighting in search results.
        required: false
        schema:
          type: boolean
      - name: highlightFragmentSize
        in: query
        description: Integer. Specifies the size in characters of each highlighted text fragment. Defaults to 100 if not specified.
        required: false
        schema:
          type: integer
          format: int32
      - name: highlightNumFragments
        in: query
        description: Integer. Controls the maximum number of highlighted fragments to return per field.
        required: false
        schema:
          type: integer
          format: int32
      - name: highlightPreTag
        in: query
        description: String. Defines the HTML tag that appears before highlighted text. Defaults to '<em>' if not specified.
        required: false
        schema:
          type: string
      - name: highlightPostTag
        in: query
        description: String. Defines the HTML tag that appears after highlighted text. Defaults to '</em>' if not specified.
        required: false
        schema:
          type: string
      - name: highlightQ
        in: query
        description: 'String. Specifies a separate query for highlighting, allowing highlights based on terms different from the main search query. Example: main query ''q=climate change'' with ''highlightQ=renewable OR solar'' will highlight terms ''renewable'' and ''solar'' in results about climate change.'
        required: false
        schema:
          type: string
      - name: expandArticles
        in: query
        description: Boolean. Preview 5 articles from the cluster.
        required: false
