  /v1/api/monitors/{uuid}/events:
    get:
      tags:
      - Monitors
      summary: List monitor events
      description: List structured events emitted by a monitor. Events represent individual matches detected by the monitor (e.g. a news article matching the monitor's criteria) and are produced asynchronously as new content is ingested.
      operationId: list-monitor-events-api
      parameters:
      - name: uuid
        in: path
        description: UUID of the monitor whose events to retrieve.
        required: true
        schema:
          type: string
          format: uuid
      - name: eventType
        in: query
        description: Filter for events with this exact event type.
        required: false
        schema:
          type: string
      - name: from
        in: query
        description: Filter for events created on or after this date. Accepts ISO 8601 or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        description: Filter for events created on or before this date. Accepts ISO 8601 or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: sortBy
        in: query
        description: Required field used to sort events. Accepts createdAt, updatedAt, or eventDate.
        required: true
        schema:
          type: string
          description: Required field used to sort events. Accepts createdAt, updatedAt, or eventDate.
      - name: page
        in: query
        description: Zero-based page number to retrieve. Defaults to 0.
        required: false
        schema:
          minimum: 0
          type: integer
          description: Zero-based page number to retrieve. Defaults to 0.
          format: int32
          default: 0
      - name: size
        in: query
