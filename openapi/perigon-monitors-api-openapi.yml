openapi: 3.2.0
info:
  title: Perigon Monitors API
  version: 1.0.0
  contact:
    name: Perigon Support
    url: https://docs.perigon.io/
    email: data@perigon.io
  description: 'Operations tagged Monitors across 2 of this provider''s published API definitions: perigon-openapi.json, perigon-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api.perigon.io
  description: Generated server url
security:
- apiKeyAuth: []
tags:
- name: Monitors
  description: Manage AI Monitors — configurable monitors that continuously scan news content for topics, entities, and events of interest. Monitors run asynchronously and emit structured events and AI-generated summaries that can be delivered to contact points.
paths:
  /v1/api/monitors:
    get:
      tags:
      - Monitors
      summary: List monitors
      description: List AI monitors for the organization associated with the API key. Excludes archived monitors by default. Use the status parameter to filter.
      operationId: list-monitors-api
      parameters:
      - name: uuid
        in: query
        description: Filter by one or more monitor UUIDs. Multiple values are combined with OR.
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
      - name: name
        in: query
        description: Filter by monitor name using a case-insensitive partial match.
        required: false
        schema:
          type: string
      - name: status
        in: query
        description: 'Filter by status: DRAFT, ACTIVE, STOPPED, or ARCHIVED. When omitted, archived monitors are excluded.'
        required: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - DRAFT
            - ACTIVE
            - STOPPED
            - ARCHIVED
      - name: classificationType
        in: query
        description: 'Filter by classification type: EVENT, MENTIONS, or TOPIC. Multiple values are combined with OR.'
        required: false
        schema:
          uniqueItems: true
          type: array
          items:
            type: string
            enum:
            - EVENT
            - MENTIONS
            - TOPIC
      - name: sortBy
        in: query
        description: Required field used to sort monitors. Accepts createdAt or updatedAt.
        required: true
        schema:
          type: string
          description: Required field used to sort monitors. Accepts createdAt or updatedAt.
      - name: page
        in: query
        description: Zero-based page number to retrieve. Defaults to 0.
        required: false
        schema:
          minimum: 0
          type: integer
          description: Zero-based page number to retrieve. Defaults to 0.
          format: int32
          default: 0
      - name: size
        in: query
        description: Number of results per page. Must be between 1 and 100; defaults to 10.
        required: false
        schema:
          maximum: 100
          minimum: 1
          type: integer
          description: Number of results per page. Must be between 1 and 100; defaults to 10.
          format: int32
          default: 10
      - name: sortOrder
        in: query
        description: Required direction used to sort results. Accepts asc or desc.
        required: true
        schema:
          type: string
          description: Required direction used to sort results. Accepts asc or desc.
          enum:
          - asc
          - desc
      - name: nulls
        in: query
        description: Placement of null values in sorted results. Accepts first or last.
        required: false
        schema:
          type: string
          description: Placement of null values in sorted results. Accepts first or last.
          enum:
          - first
          - last
      responses:
        '401':
          description: 401 - Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Invalid API key.
                timestamp: 1681338367402
        '500':
          description: 500 - Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal error. Please contact the support to resolve the problem. We apologize for any inconvenience :)
                timestamp: 1681338367402
        '200':
