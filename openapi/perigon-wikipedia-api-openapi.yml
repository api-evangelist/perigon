            - 1
            textRaw: 'During the night of January 18/19, 2021, concrete foundations for three Giga Press high-press die-casting machines were poured at the north-east corner Giga Texas factory location. On January 21, 2021, the first Giga Press components started to arrive on site in crates and shipping containers.

              On January 22, 2021, the base frame of the first Giga Press was unboxed and craned into position.'
            textRich: 'During the night of January 18/19, 2021, concrete foundations for three [Giga Press](https://en.wikipedia.org/wiki/Giga_Press "Giga Press") high-press die-casting machines were poured at the north-east corner Giga Texas factory location. On January 21, 2021, the first Giga Press components started to arrive on site in crates and [shipping containers](https://en.wikipedia.org/wiki/Intermodal_container "Intermodal container").

              On January 22, 2021, the base frame of the first Giga Press was unboxed and craned into position.'
