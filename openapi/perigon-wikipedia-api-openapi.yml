openapi: 3.2.0
info:
  title: Perigon Wikipedia API
  description: The Perigon API provides access to comprehensive news and web content data. To use the API, simply sign up for a Perigon Business Solutions account to obtain your API key. Your available features may vary based on your plan. See the Authentication section for details on how to use your API key.
  contact:
    name: Perigon Support
    url: https://docs.perigon.io/
    email: data@perigon.io
  version: 1.0.0
servers:
- url: https://api.perigon.io
  description: Generated server url
security:
- apiKeyAuth: []
tags:
- name: Wikipedia
  description: Endpoints for searching ingested Wikipedia content. Provides keyword and filtered search capabilities along with vector-based semantic search across Wikipedia pages.
paths:
  /v1/vector/wikipedia/all:
    post:
      tags:
      - Wikipedia
      summary: Wikipedia (Vector)
      description: Perform a natural language search over Wikipedia pages using semantic relevance. The result includes a list of page sections most closely matched to your query intent.
      operationId: vector-search-wikipedia
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WikipediaSearchParams'
        required: true
      responses:
        '401':
          description: 401 - Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Invalid API key.
                timestamp: 1681338367402
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikipediaVectorSearchResult'
        '500':
          description: 500 - Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal error. Please contact the support to resolve the problem. We apologize for any inconvenience :)
                timestamp: 1681338367402
        '400':
          description: 400 - Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Errors during parameter validation.
                timestamp: 1681338367402
        '403':
          description: 403 - Request Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                message: The number of allowed requests is exceeded.
                timestamp: 1681338367402
        '429':
          description: 429 - Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 429
                message: Exceeded request rate limit for your account.
                timestamp: 1681338367402
      security:
      - apiKeyAuth: []
  /v1/wikipedia/all:
    get:
      tags:
      - Wikipedia
      summary: Wikipedia
      description: Search and filter all Wikipedia pages available via the Perigon API. The result includes a list of individual pages that were matched to your specific criteria.
      operationId: search-wikipedia
      parameters:
      - name: q
        in: query
        description: String. Primary search query for filtering pages based on their title, summary, and content. Supports Boolean operators (AND, OR, NOT), exact phrases with quotes, and wildcards (* and ?) for flexible searching.
        required: false
        schema:
          type: string
      - name: title
        in: query
        description: String. Search specifically within page titles. Supports Boolean operators, exact phrases with quotes, and wildcards for matching title variations.
        required: false
        schema:
          type: string
      - name: summary
        in: query
        description: String. Search specifically within page summary. Supports Boolean operators, exact phrases with quotes, and wildcards for matching title variations.
        required: false
        schema:
          type: string
      - name: text
        in: query
        description: String. Search specifically within the page's content (across all sections). Supports Boolean operators, exact phrases with quotes, and wildcards for matching title variations.
        required: false
        schema:
          type: string
      - name: reference
        in: query
        description: String. Search specifically across page's references. Supports Boolean operators, exact phrases with quotes, and wildcards for matching title variations.
        required: false
        schema:
          type: string
      - name: id
        in: query
        description: String Array. Retrieve specific pages by their unique Perigon identifiers. Multiple IDs can be provided to return a collection of specific pages.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: wikiPageId
        in: query
        description: Integer Array. Retrieve specific pages by their Wikipedia identifiers. These are unique only in a combination with `wikiCode` parameter. Multiple IDs can be provided to return a collection of specific pages.
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: wikiRevisionId
        in: query
        description: Integer Array. Retrieve specific pages by their Wikipedia revision identifiers. These are unique only in a combination with `wikiCode` parameter. Multiple IDs can be provided to return a collection of specific pages. This ID changes each time a page is edited.
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: wikiCode
        in: query
        description: String Array. Retrieve pages only from specified wiki projects. Currently, the only accepted value is `enwiki`.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: wikiNamespace
        in: query
        description: Integer Array. Retrieve pages only from specified wiki namespace. Currently, only the main namespace (0) is available.
        required: false
        schema:
          type: array
          items:
            type: integer
            format: int32
      - name: wikidataId
        in: query
        description: String Array. Retrieve pages by the ids corresponding to their Wikidata entities.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: wikidataInstanceOfId
        in: query
        description: String Array. Retrieve all pages whose Wikidata entities are instances of these provided ids.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: wikidataInstanceOfLabel
        in: query
        description: String Array. Retrieve all pages whose Wikidata entities are instances of these ids (provided as labels).
        required: false
        schema:
          type: array
          items:
            type: string
      - name: category
        in: query
        description: String Array. Retrieve all pages for specified categories.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: sectionId
        in: query
        description: String Array. Retrieve pages containing provided section ids. Each section ID is unique.
        required: false
        schema:
          type: array
          items:
            type: string
      - name: wikiRevisionFrom
        in: query
        description: Date. Retrieve pages modified after this date. Accepts ISO 8601 format (e.g., 2023-03-01T00:00:00) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: wikiRevisionTo
        in: query
        description: Date. Retrieve pages modified before this date. Accepts ISO 8601 format (e.g., 2023-03-01T00:00:00) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: scrapedAtFrom
        in: query
        description: Date. Retrieve pages scraped after this date. Accepts ISO 8601 format (e.g., 2023-03-01T00:00:00) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: scrapedAtTo
        in: query
        description: Date. Retrieve pages scraped before this date. Accepts ISO 8601 format (e.g., 2023-03-01T00:00:00) or yyyy-mm-dd format.
        required: false
        schema:
          type: string
          format: date-time
      - name: pageviewsFrom
        in: query
        description: Integer. Retrieve pages with the average number of views per day higher than the provided value.
        required: false
        schema:
          type: integer
          format: int64
      - name: pageviewsTo
        in: query
        description: Integer. Retrieve pages with the average number of views per day lower than the provided value.
        required: false
        schema:
          type: integer
          format: int64
      - name: withPageviews
        in: query
        description: Boolean. Retrieve pages that have any viewership statistics available for them. If `false` (the default) - return all pages.
        required: false
        schema:
          type: boolean
      - name: showNumResults
        in: query
        description: Boolean. Whether to show the total number of all matched pages. Default value is false which makes queries a bit more efficient but also counts up to 10000 pages.
        required: false
        schema:
          type: boolean
      - name: page
        in: query
        description: Integer. The specific page of results to retrieve in the paginated response. Starts at 0.
        required: false
        schema:
          maximum: 10000
          minimum: 0
          type: integer
          format: int32
      - name: size
        in: query
        description: Integer. The number of articles to return per page in the paginated response.
        required: false
        schema:
          maximum: 1000
          minimum: 0
          type: integer
          format: int32
      - name: sortBy
        in: query
        description: String. Determines the Wikipedia page sorting order. Options include relevance (default), revisionTsDesc (recently edited first), revisionTsAsc (recently edited last), pageViewsDesc (highest viewership first), pageViewsAsc (highest viewership last), scrapedAtDesc (recently scraped first), scrapedAtAsc (recently scraped last).
        required: false
        schema:
          type: string
          enum:
          - relevance
          - revisionTsDesc
          - revisionTsAsc
          - pageViewsDesc
          - pageViewsAsc
          - scrapedAtDesc
          - scrapedAtAsc
      responses:
        '401':
          description: 401 - Invalid API Key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 401
                message: Invalid API key.
                timestamp: 1681338367402
        '500':
          description: 500 - Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 500
                message: Internal error. Please contact the support to resolve the problem. We apologize for any inconvenience :)
                timestamp: 1681338367402
        '400':
          description: 400 - Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 400
                message: Errors during parameter validation.
                timestamp: 1681338367402
        '200':
          description: 200 - Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WikipediaSearchResult'
        '403':
          description: 403 - Request Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 403
                message: The number of allowed requests is exceeded.
                timestamp: 1681338367402
        '429':
          description: 429 - Too Many Requests
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                status: 429
                message: Exceeded request rate limit for your account.
                timestamp: 1681338367402
      security:
      - apiKeyAuth: []
components:
  schemas:
    ScoredDataWikiData:
      type: object
      properties:
        score:
          type:
          - number
          - 'null'
          format: float
        data:
          allOf:
          - $ref: '#/components/schemas/WikiData'
        vectors:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/VectorData'
    ErrorResponse:
      type: object
      properties:
        status:
          type:
          - integer
          - 'null'
          format: int32
        message:
          type:
          - string
          - 'null'
        timestamp:
          type:
          - integer
          - 'null'
          format: int64
    WikipediaSearchFilter:
      type: object
      properties:
        pageId:
          type:
          - array
          - 'null'
          description: Filter by specific Perigon page identifiers. Accepts either a single ID or an array of IDs. Returns only pages matching these IDs.
          example:
          - ''
          items:
            type: string
        sectionId:
          type:
          - array
          - 'null'
          description: Filter by specific section identifiers. Accepts either a single ID or an array of IDs. Returns only pages containing these sections.
          example:
          - ''
          items:
            type: string
        wikiPageId:
          type:
          - array
          - 'null'
          description: Filter by specific Wikipedia page identifiers. Accepts either a single ID or an array of IDs. Returns only pages matching these IDs.
          example:
          - 0
          items:
            type: integer
            format: int64
        wikiRevisionId:
          type:
          - array
          - 'null'
          description: Filter by specific Perigon page revision identifiers. Accepts either a single ID or an array of IDs. Returns only pages matching these IDs.
          example:
          - 0
          items:
            type: integer
            format: int64
        wikiCode:
          type:
          - array
          - 'null'
          description: Filter by specific Wikipedia project codes. Returns only pages matching these projects.
          example:
          - ''
          items:
            type: string
        wikiNamespace:
          type:
          - array
          - 'null'
          description: Filter by specific Wikipedia namespaces. Returns only pages matching these namespaces.
          example:
          - 0
          items:
            type: integer
            format: int64
        wikidataId:
          type:
          - array
          - 'null'
          description: Filter by specific Wikidata entity IDs. Returns only pages whose Wikidata entities match those ids.
          example:
          - ''
          items:
            type: string
        wikidataInstanceOfId:
          type:
          - array
          - 'null'
          description: Filter by specific Wikidata entity IDs. Returns only pages whose Wikidata entities are instances of provided ids.
          example:
          - ''
          items:
            type: string
        wikidataInstanceOfLabel:
          type:
          - array
          - 'null'
          description: Filter by specific Wikidata entity labels. Returns only pages whose Wikidata entities are instances of these labels.
          example:
          - ''
          items:
            type: string
        AND:
          type:
          - array
          - 'null'
          description: Adds additional AND filter objects. These objects must be of the same type as the original filter object and will be combined with the existing filter using the AND logical operator.
          example:
          - {}
          items:
            $ref: '#/components/schemas/WikipediaSearchFilter'
        OR:
          type:
          - array
          - 'null'
          description: Adds additional OR filter objects. These objects must be of the same type as the original filter object and will be combined with the existing filter using the OR logical operator.
          example:
          - {}
          items:
            $ref: '#/components/schemas/WikipediaSearchFilter'
        NOT:
          type:
          - array
          - 'null'
          description: A filter object for logical NOT operations
          example:
          - {}
          items:
            $ref: '#/components/schemas/WikipediaSearchFilter'
      description: Complex filter structure for Wikipedia page searches that supports nested logical operations (AND, OR, NOT) and multiple filtering criteria.
    WikiData:
      type: object
      properties:
        pageId:
          type:
          - string
          - 'null'
        sectionId:
          type:
          - string
          - 'null'
        wikiPageId:
          type:
          - integer
          - 'null'
          format: int32
        wikiRevisionId:
          type:
          - integer
          - 'null'
          format: int32
        wikiRevisionTs:
          type:
          - string
          - 'null'
        wikiCode:
          type:
          - string
          - 'null'
        wikiNamespace:
          type:
          - integer
          - 'null'
          format: int32
        wikiTitle:
          type:
          - string
          - 'null'
        wikidataId:
          type:
          - string
          - 'null'
        wikidataInstanceOf:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/WikidataLabelHolder'
        redirectTitles:
          type:
          - array
          - 'null'
          items:
            type: string
        pageviews:
          type:
          - integer
          - 'null'
          format: int64
        title:
          type:
          - string
          - 'null'
        styleLevel:
          type:
          - integer
          - 'null'
          format: int32
        content:
          type:
          - string
          - 'null'
    WikipediaVectorSearchResult:
      required:
      - results
      - status
      type: object
      properties:
        status:
          type: integer
          format: int32
        results:
          type: array
          items:
            $ref: '#/components/schemas/ScoredDataWikiData'
      description: Wikipedia vector search result
      example:
        status: 200
        results:
        - score: 0.6632843
          data:
            pageId: a9e264ec1f6a4c049e3be8e997e24d2f
            sectionId: d3d9e592df354cb9abcac4d3c5d38065
            wikiPageId: 63988579
            wikiRevisionId: 1300572396
            wikiRevisionTs: '2025-07-15T04:19:25Z'
            wikiCode: enwiki
            wikiNamespace: 0
            wikiTitle: Gigafactory Texas
            wikidataId: Q96379480
            wikidataInstanceOf:
            - wikidataId: Q83405
              label: factory
            redirectTitles:
            - Giga Austin
            - Gigafactory 5
            - Tesla Gigafactory 5
            - Terafactory
            - Giga Texas
            - Austin Gigafactory
            pageviews: 339
            title: Austin
            styleLevel: 3
            content: "In 2014, Tesla evaluated a 1,500-acre (600 ha; 2 sq mi; 6 km2) manufacturing site on U.S. Route 79 at Frame Switch (30°32′N 97°30′W\uFEFF / \uFEFF30.54°N 97.5°W\uFEFF / 30.54; -97.5\uFEFF (Hutto MegaSite, (Frame Switch, Texas))), located between the towns of Hutto and Taylor, north-east of the Greater Austin center as its next factory. However, Tesla chose to build its first Gigafactory (now named Gigafactory Nevada) near Sparks, Nevada which is by Reno in 2014.\n\nBy June 2020, another location, one near the Del Valle area of Austin was being considered, a 2,100-acre (850 ha; 3.3 sq mi; 8.5 km2) site bordering Harold Green Road (later renamed Tesla Road) and Texas State Highway 130. On June 16, 2020, the Commissioners' court of Travis County discussed a possible incentives package for Tesla. In July 2020, the Del Valle Independent School District approved a tax incentives package worth $68 million, should the Tesla Gigafactory be built. On July 22, 2020, during Tesla's second quarter 2020 earnings call, the company announced that location had been selected for its fifth Gigafactory.\n\nBy the end of July 2020, construction had begun. The Tesla Gigafactory received state tax incentives worth about $50 million through the Texas Tax Code Chapter 313 program. Tesla announced a manufacturing training program in cooperation with Austin Community College District on June 15, 2021. The program was expected to start in August 2021 and the course was to last 14 weeks. The first fully completed Tesla Model Y rolled off the line at Giga Texas in the last week of August 2021 under trial production. In December 2021, Elon Musk estimated that Giga Texas will require a total investment of at least $10B and may employ as many as 20,000 employees within the company.\n\nIn early 2022 Tesla battery suppliers CATL and Panasonic were reportedly scouting sites for battery factories in North America, including Kansas, Oklahoma, Mexico and Canada. Panasonic announced in July 2022 that the company selected De Soto, Kansas (at the former Sunflower Army Ammunition Plant) to build a battery factory. Large subsidies and abatements were granted to Panasonic, organized by Governor Laura Kelly."
    VectorData:
      type: object
      properties:
        data:
          type:
          - array
          - 'null'
          description: Numeric values in the vector embedding.
          items:
            type: number
            description: Numeric values in the vector embedding.
            format: float
        version:
          type:
          - integer
          - 'null'
          description: Version of the embedding representation.
          format: int32
      description: Vector embeddings associated with the article, when requested.
    WikipediaSearchResult:
      required:
      - numResults
      - results
      - status
      type: object
      properties:
        status:
          type: integer
          format: int32
        numResults:
          type: integer
          format: int64
        results:
          type: array
          items:
            $ref: '#/components/schemas/WikiPage'
      description: Wikipedia search result
      example:
        status: 200
        numResults: 10000
        results:
        - id: a9e264ec1f6a4c049e3be8e997e24d2f
          scrapedAt: '2025-07-15T04:20:01.114925+00:00'
          wikiPageId: 63988579
          wikiRevisionId: 1300572396
          wikiRevisionTs: '2025-07-15T04:19:25+00:00'
          wikiCode: enwiki
          wikiNamespace: 0
          wikiTitle: Gigafactory Texas
          url: https://en.wikipedia.org/wiki/Gigafactory_Texas
          topImage: https://upload.wikimedia.org/wikipedia/commons/b/b6/Gigafactory_Texas_Building_1_June_2022.jpg
          wikidataId: Q96379480
          wikidataInstanceOf:
          - wikidataId: Q83405
            label: factory
          redirectTitles:
          - Giga Austin
          - Gigafactory 5
          - Tesla Gigafactory 5
          - Terafactory
          - Giga Texas
          - Austin Gigafactory
          summary: 'Gigafactory Texas (also known as Giga Texas, Giga Austin, or Gigafactory 5) is a Tesla, Inc. automotive manufacturing facility in unincorporated Travis County, Texas, just outside of Austin. Construction began in July 2020, limited production of Model Y began before the end of 2021, and initial deliveries of vehicles built at the factory took place at an opening party called "Cyber Rodeo" on April 7, 2022.

            The factory produces Model Y cars for the Eastern United States and is also the main factory for the Cybertruck and the company''s next-generation vehicle. It also serves as the site of Tesla''s corporate headquarters. It is the country''s second biggest factory by size as well as the second-largest building by volume in the world after the Boeing Everett Factory.

            Tesla originally planned to employ a staff of over 60,000 as production ramped up. However, in 2024, approx. 2,700 employees (12% of the factory''s workforce) were terminated in one of the largest layoffs in Austin history.'
          sections:
          - id: bc3387b303914a38b23f5ad1d149e897
            title: History
            styleLevel: 2
            loc:
            - 1
          - id: 884ef99ea6514752890d08f5dfe9757b
            title: Selection process
            styleLevel: 3
            loc:
            - 1
            - 1
            textRaw: 'Tesla began considering locations across eight states in the central United States during 2019‒2020. Community groups and government officials in several areas of the US expressed interest in hosting what was expected to be a very large Tesla Gigafactory manufacturing facility. Some expressed interest in facilitating land procurement, getting over the regulatory obstacles, and considering potential tax incentives. Some aimed to reach Elon Musk directly through social media marketing.


              By May 2020, a selection process was underway by Tesla. The short list included Austin, Nashville and Tulsa (Oklahoma). Two locations in the vicinity of Tulsa had been viewed by Tesla by mid-May. The Tulsa campaign was promoted by G. T. Bynum, the mayor of Tulsa. In May 2020 Bynum discussed the suitability of "Green Country" (Northeastern Oklahoma) and distributed a photomontage of the Cybertruck in Tulsa Police Department livery, with a suggestion of local purchasing, if the Gigafactory was to be situated near Tulsa. On May 20, 2020, wrap advertising was applied to the Golden Driller statue located at the Tulsa Expo Center creating a caricature of Elon Musk, with the word "Tulsa" on statue''s belt buckle replaced by the "Tesla" name. In July 2020, Tesla selected Austin as the site for the factory.'
            textRich: 'Tesla began considering locations across eight states in the central United States during 2019‒2020. Community groups and government officials in several areas of the US expressed interest in hosting what was expected to be a very large Tesla Gigafactory manufacturing facility. Some expressed interest in facilitating land procurement, getting over the [regulatory obstacles](https://en.wikipedia.org/wiki/Regulatory_authority "Regulatory authority"), and considering potential [tax incentives](https://en.wikipedia.org/wiki/Tax_incentives "Tax incentives"). Some aimed to reach [Elon Musk](https://en.wikipedia.org/wiki/Elon_Musk "Elon Musk") directly through [social media marketing](https://en.wikipedia.org/wiki/Social_media_marketing "Social media marketing").


              By May 2020, a selection process was underway by Tesla. The [short list](https://en.wikipedia.org/wiki/Short_list "Short list") included Austin, [Nashville](https://en.wikipedia.org/wiki/Nashville,_Tennessee "Nashville, Tennessee") and [Tulsa (Oklahoma)](https://en.wikipedia.org/wiki/Tulsa,_Oklahoma "Tulsa, Oklahoma"). Two locations in the vicinity of Tulsa had been viewed by Tesla by mid-May. The Tulsa campaign was promoted by [G. T. Bynum](https://en.wikipedia.org/wiki/G._T._Bynum "G. T. Bynum"), the [mayor of Tulsa](https://en.wikipedia.org/wiki/List_of_mayors_of_Tulsa,_Oklahoma "List of mayors of Tulsa, Oklahoma"). In May 2020 Bynum discussed the suitability of "[Green Country](https://en.wikipedia.org/wiki/Green_Country "Green Country")" (Northeastern Oklahoma) and distributed a [photomontage](https://en.wikipedia.org/wiki/Photomontage "Photomontage") of the Cybertruck in [Tulsa Police Department](https://en.wikipedia.org/wiki/Tulsa_Police_Department "Tulsa Police Department") livery, with a suggestion of [local purchasing](https://en.wikipedia.org/wiki/Local_purchasing "Local purchasing"), if the Gigafactory was to be situated near Tulsa. On May 20, 2020, [wrap advertising](https://en.wikipedia.org/wiki/Wrap_advertising "Wrap advertising") was applied to the [Golden Driller](https://en.wikipedia.org/wiki/Golden_Driller "Golden Driller") statue located at the [Tulsa Expo Center](https://en.wikipedia.org/wiki/Tulsa_Expo_Center "Tulsa Expo Center") creating a [caricature](https://en.wikipedia.org/wiki/Caricature "Caricature") of [Elon Musk](https://en.wikipedia.org/wiki/Elon_Musk "Elon Musk"), with the word "Tulsa" on statue''s [belt buckle](https://en.wikipedia.org/wiki/Belt_buckle "Belt buckle") replaced by the "Tesla" name. In July 2020, Tesla selected Austin as the site for the factory.'
          - id: d3d9e592df354cb9abcac4d3c5d38065
            title: Austin
            styleLevel: 3
            loc:
            - 1
            - 2
            textRaw: "In 2014, Tesla evaluated a 1,500-acre (600 ha; 2 sq mi; 6 km2) manufacturing site on U.S. Route 79 at Frame Switch (30°32′N 97°30′W\uFEFF / \uFEFF30.54°N 97.5°W\uFEFF / 30.54; -97.5\uFEFF (Hutto MegaSite, (Frame Switch, Texas))), located between the towns of Hutto and Taylor, north-east of the Greater Austin center as its next factory. However, Tesla chose to build its first Gigafactory (now named Gigafactory Nevada) near Sparks, Nevada which is by Reno in 2014.\n\nBy June 2020, another location, one near the Del Valle area of Austin was being considered, a 2,100-acre (850 ha; 3.3 sq mi; 8.5 km2) site bordering Harold Green Road (later renamed Tesla Road) and Texas State Highway 130. On June 16, 2020, the Commissioners' court of Travis County discussed a possible incentives package for Tesla. In July 2020, the Del Valle Independent School District approved a tax incentives package worth $68 million, should the Tesla Gigafactory be built. On July 22, 2020, during Tesla's second quarter 2020 earnings call, the company announced that location had been selected for its fifth Gigafactory.\n\nBy the end of July 2020, construction had begun. The Tesla Gigafactory received state tax incentives worth about $50 million through the Texas Tax Code Chapter 313 program. Tesla announced a manufacturing training program in cooperation with Austin Community College District on June 15, 2021. The program was expected to start in August 2021 and the course was to last 14 weeks. The first fully completed Tesla Model Y rolled off the line at Giga Texas in the last week of August 2021 under trial production. In December 2021, Elon Musk estimated that Giga Texas will require a total investment of at least $10B and may employ as many as 20,000 employees within the company.\n\nIn early 2022 Tesla battery suppliers CATL and Panasonic were reportedly scouting sites for battery factories in North America, including Kansas, Oklahoma, Mexico and Canada. Panasonic announced in July 2022 that the company selected De Soto, Kansas (at the former Sunflower Army Ammunition Plant) to build a battery factory. Large subsidies and abatements were granted to Panasonic, organized by Governor Laura Kelly."
            textRich: "In 2014, Tesla evaluated a 1,500-acre (600 ha; 2 sq mi; 6 km2) manufacturing site on [U.S. Route 79](https://en.wikipedia.org/wiki/U.S._Route_79_in_Texas \"U.S. Route 79 in Texas\") at [Frame Switch](https://en.wikipedia.org/wiki/Frame_Switch,_Texas \"Frame Switch, Texas\") ([30°32′N 97°30′W\uFEFF / \uFEFF30.54°N 97.5°W\uFEFF / 30.54; -97.5\uFEFF (Hutto MegaSite, (Frame Switch, Texas))](https://geohack.toolforge.org/geohack.php?pagename=Gigafactory_Texas&params=30.54_N_97.5_W_dim:2000&title=Hutto+MegaSite%2C+%28Frame+Switch%2C+Texas%29)), located between the towns of [Hutto](https://en.wikipedia.org/wiki/Hutto,_Texas \"Hutto, Texas\") and [Taylor](https://en.wikipedia.org/wiki/Taylor,_Texas \"Taylor, Texas\"), north-east of the [Greater Austin](https://en.wikipedia.org/wiki/Greater_Austin \"Greater Austin\") center as its next factory. However, Tesla chose to build its first Gigafactory (now named [Gigafactory Nevada](https://en.wikipedia.org/wiki/Gigafactory_Nevada \"Gigafactory Nevada\")) near [Sparks, Nevada](https://en.wikipedia.org/wiki/Sparks,_Nevada \"Sparks, Nevada\") which is by [Reno](https://en.wikipedia.org/wiki/Reno,_Nevada \"Reno, Nevada\") in 2014.\n\nBy June 2020, another location, one near the [Del Valle area of Austin](https://en.wikipedia.org/wiki/Del_Valle,_Texas \"Del Valle, Texas\") was being considered, a 2,100-acre (850 ha; 3.3 sq mi; 8.5 km2) site bordering Harold Green Road (later renamed Tesla Road) and [Texas State Highway 130](https://en.wikipedia.org/wiki/Texas_State_Highway_130 \"Texas State Highway 130\"). On June 16, 2020, the [Commissioners' court](https://en.wikipedia.org/wiki/Commissioners'_court \"Commissioners' court\") of [Travis County](https://en.wikipedia.org/wiki/Travis_County,_Texas \"Travis County, Texas\") discussed a possible incentives package for Tesla. In July 2020, the [Del Valle Independent School District](https://en.wikipedia.org/wiki/Del_Valle_Independent_School_District \"Del Valle Independent School District\") approved a tax incentives package worth $68 million, should the Tesla Gigafactory be built. On July 22, 2020, during Tesla's second quarter 2020 earnings call, the company announced that location had been selected for its fifth Gigafactory.\n\nBy the end of July 2020, construction had begun. The Tesla Gigafactory received state tax incentives worth about $50 million through the [Texas Tax Code Chapter 313](https://en.wikipedia.org/wiki/Texas_Tax_Code_Chapter_313 \"Texas Tax Code Chapter 313\") program. Tesla announced a manufacturing training program in cooperation with [Austin Community College District](https://en.wikipedia.org/wiki/Austin_Community_College_District \"Austin Community College District\") on June 15, 2021. The program was expected to start in August 2021 and the course was to last 14 weeks. The first fully completed Tesla Model Y rolled off the line at Giga Texas in the last week of August 2021 under trial production. In December 2021, Elon Musk estimated that Giga Texas will require a total investment of at least $10B and may employ as many as 20,000 employees within the company.\n\nIn early 2022 Tesla battery suppliers [CATL](https://en.wikipedia.org/wiki/Contemporary_Amperex_Technology \"Contemporary Amperex Technology\") and [Panasonic](https://en.wikipedia.org/wiki/Panasonic \"Panasonic\") were reportedly scouting sites for battery factories in North America, including Kansas, Oklahoma, Mexico and Canada. Panasonic announced in July 2022 that the company selected [De Soto, Kansas](https://en.wikipedia.org/wiki/De_Soto,_Kansas \"De Soto, Kansas\") (at the former [Sunflower Army Ammunition Plant](https://en.wikipedia.org/wiki/Sunflower_Army_Ammunition_Plant \"Sunflower Army Ammunition Plant\")) to build a battery factory. Large subsidies and abatements were granted to Panasonic, organized by Governor [Laura Kelly](https://en.wikipedia.org/wiki/Laura_Kelly \"Laura Kelly\")."
