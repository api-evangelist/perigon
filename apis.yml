aid: perigon
name: Perigon
description: Perigon is a real-time global news data and intelligence platform. It provides structured, enriched news data
  from 200,000+ sources worldwide through REST APIs — articles, clustered stories, AI search summaries, semantic vector search,
  sources, companies, people, journalists, topics and Wikipedia — plus Signals, an AI-driven monitoring product with monitors,
  watchlists, contact points and signed webhooks. Perigon publishes an OpenAPI description, a hosted remote MCP server, official
  TypeScript, Python and Go SDKs, Agent Skills, and an API versioning and deprecation policy.
