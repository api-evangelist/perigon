  name: Perigon MCP Server
  description: >-
    Hosted remote Model Context Protocol server (Streamable HTTP, with an SSE variant) exposing Perigon
    news search, analytics and monitor tools to AI clients. Authenticates with a Perigon API key as a
    bearer token; a same-origin endpoint at https://perigon.io/mcp serves public resources and a server
    card.
  humanURL: https://perigon.io/docs/api/mcp
